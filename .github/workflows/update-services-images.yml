name: Update service images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-services:
    if: "!contains(github.event.head_commit.message, 'chore(services):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update only Nos services images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          images = [
              ('Création de sites web', 'https://images.unsplash.com/photo-1758640931640-6e0b8f4a2f5f?auto=format&fit=crop&w=900&q=85'),
              ('Développement d\'applications', 'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=900&q=85'),
              ('Branding', 'https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=900&q=85'),
              ('Marketing digital', 'https://images.unsplash.com/photo-1596526131083-e8c633c948d2?auto=format&fit=crop&w=900&q=85'),
              ('Création de contenu', 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=900&q=85'),
              ('Programme de formation', 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=85'),
          ]

          start = text.find('<div class="services-grid">')
          if start < 0:
              raise SystemExit('services-grid introuvable')
          end = text.find('</div>', start)
          depth = 0
          pos = start
          # Find the closing div belonging to services-grid.
          for m in re.finditer(r'<div\b|</div>', text[start:]):
              token = m.group(0)
              if token.startswith('<div'):
                  depth += 1
              else:
                  depth -= 1
              if depth == 0:
                  end = start + m.end()
                  break
          section = text[start:end]

          cards = list(re.finditer(r'<article class="card reveal">', section))
          if len(cards) != len(images):
              raise SystemExit(f'Nombre de services inattendu: {len(cards)} au lieu de {len(images)}')

          for title, url in images:
              if title not in section:
                  raise SystemExit(f'Service introuvable: {title}')

          # Remove only previously injected service images in this section.
          section = re.sub(r'\s*<img class="service-image"[^>]*>', '', section)

          offset = 0
          for match, (title, url) in zip(list(re.finditer(r'<article class="card reveal">', section)), images):
              insert_at = match.end() + offset
              html = f'\n            <img class="service-image" src="{url}" alt="{title} — Bickri Service Agency" loading="lazy" decoding="async" />'
              section = section[:insert_at] + html + section[insert_at:]
              offset += len(html)

          text = text[:start] + section + text[end:]

          css = '''\n    /* Images uniques — section Nos services uniquement */\n    .services-grid .card {\n      padding-top: 0;\n    }\n\n    .services-grid .service-image {\n      width: calc(100% + 60px);\n      height: 220px;\n      margin: 0 -30px 30px;\n      object-fit: cover;\n      display: block;\n      border-radius: var(--radius) var(--radius) 0 0;\n      border-bottom: 1px solid var(--border);\n    }\n\n    .services-grid .card-icon {\n      margin-left: 0;\n    }\n'''
          marker = '/* Images uniques — section Nos services uniquement */'
          if marker not in text:
              text = text.replace('</style>', css + '  </style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit final change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-services-images.yml
          git rm .github/workflows/update-services-images.yml
          git commit -m "chore(services): add unique Unsplash photos to Nos services"
          git push
