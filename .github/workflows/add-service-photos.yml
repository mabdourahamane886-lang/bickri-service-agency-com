name: Add service photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          photos={
          'Création de sites web':('https://images.unsplash.com/photo-1610473199899-fc0ec6e204bb?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Femme noire travaillant sur un ordinateur portable — création web'),
          "Développement d'applications":('https://images.unsplash.com/photo-1769375581646-a31c35f448d9?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Jeune homme noir entrepreneur — développement d applications'),
          'Branding & Design':('https://images.unsplash.com/photo-1779181668325-6f918a73bb54?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Jeune femme noire souriante — branding et design'),
          'Marketing digital':('https://images.unsplash.com/photo-1778403249208-f205a6eb3959?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Jeune homme noir utilisant son téléphone — marketing digital'),
          'Intelligence artificielle':('https://images.unsplash.com/photo-1776781205743-33b4c1106adc?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Homme noir en costume — intelligence artificielle et innovation'),
          'Création de contenu':('https://images.unsplash.com/photo-1700295490655-ded1289421f3?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1200','Femme noire au travail — création de contenu')}
          for title,(url,alt) in photos.items():
              marker=f'<h3>{title}</h3>'; pos=h.find(marker)
              if pos<0: raise SystemExit(f'Service introuvable: {title}')
              start=h.rfind('<article class="card reveal">',0,pos)
              icon=h.find('<div class="card-icon">',start,pos)
              if icon<0: raise SystemExit(f'Carte introuvable: {title}')
              if 'class="service-photo"' not in h[start:pos]:
                  img=f'<img class="service-photo" src="{url}" alt="{alt}" loading="lazy" style="width:100%;height:190px;object-fit:cover;border-radius:18px;margin-bottom:24px;" />\n            '
                  h=h[:icon]+img+h[icon:]
          p.write_text(h,encoding='utf-8')
          PY
          git config user.name "Bickri Service Agency"
          git config user.email "254426317+mabdourahamane886-lang@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "feat: add distinct African photos to service cards" && git push)
